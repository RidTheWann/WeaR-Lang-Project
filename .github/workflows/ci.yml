name: WeaR Lang CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    name: Native compiler regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run native regression suite
        run: bash tests/run_regression.sh

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for tracked generated compiler output
        run: |
          if git ls-files | grep -E '(^|/)(output\.c|stage[0-9]*\.c|.*\.o|wear-smoke)$'; then
            echo 'Generated build artifacts must not be tracked.'
            exit 1
          fi

      - name: Check required development docs
        run: |
          test -s README.md
          test -s PROGRESS.md
          test -s SECURITY.md
