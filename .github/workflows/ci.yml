name: WeaR Lang CI

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    name: Native compiler regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run native regression suite
        run: bash tests/run_regression.sh

  native-integration-audit:
    name: Native symbol integration audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native symbol-table wiring
        run: python3 tools/audit_native_integration.py

  semantic-static-check:
    name: Deterministic semantic static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify semantic fixtures without compiler heuristics
        run: |
          python3 tools/typecheck_wr.py tests/cases/string_symbol_tracking.wr
          python3 tools/typecheck_wr.py tests/cases/print_types.wr

  deferred-semantic-regression:
    name: Deferred semantic regression (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run deferred semantic regression surface
        env:
          WEAR_RUN_DEFERRED: '1'
        run: bash tests/run_regression.sh

  bootstrap-audit:
    name: Stage-0 / Stage-1 bootstrap audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bootstrap capability audit
        run: python3 tools/audit_bootstrap.py

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for tracked generated compiler output
        run: |
          if git ls-files | grep -E '(^|/)(output\.c|stage[0-9]*\.c|.*\.o|wear-smoke)$'; then
            echo 'Generated build artifacts must not be tracked.'
            exit 1
          fi

      - name: Check required development docs
        run: |
          test -s README.md
          test -s PROGRESS.md
          test -s SECURITY.md
