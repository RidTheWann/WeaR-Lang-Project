name: WeaR Lang CI

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage0-repair:
    name: Apply Stage-0 M1 source repairs
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/m1-regression-hardening'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/m1-regression-hardening

      - name: Apply deterministic repair codemod
        run: python3 tools/repair_stage0.py

      - name: Commit source repairs
        run: |
          if git diff --quiet; then
            echo "No Stage-0 repairs required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler.c runtime.c
          git commit -m "fix(compiler): repair Stage-0 bootstrap compatibility"
          git push origin HEAD:feature/m1-regression-hardening

  native-regression:
    name: Native compiler regression suite
    needs: stage0-repair
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run native regression suite
        run: bash tests/run_regression.sh

  bootstrap-audit:
    name: Stage-0 / Stage-1 bootstrap audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bootstrap capability audit
        run: python3 tools/audit_bootstrap.py

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for tracked generated compiler output
        run: |
          if git ls-files | grep -E '(^|/)(output\.c|stage[0-9]*\.c|.*\.o|wear-smoke)$'; then
            echo 'Generated build artifacts must not be tracked.'
            exit 1
          fi

      - name: Check required development docs
        run: |
          test -s README.md
          test -s PROGRESS.md
          test -s SECURITY.md
