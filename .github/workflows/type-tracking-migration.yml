name: WeaR Lang Type Tracking Migration

on:
  push:
    branches:
      - feature/m1-regression-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'refactor(compiler): add deterministic string symbol tracking'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/m1-regression-hardening
      - name: Apply type tracking migration
        run: python3 tools/enable_type_tracking.py
      - name: Commit migrated compiler sources
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler.c compiler.wr
          git commit -m 'refactor(compiler): enable deterministic string symbol tracking'
          git push origin HEAD:feature/m1-regression-hardening
