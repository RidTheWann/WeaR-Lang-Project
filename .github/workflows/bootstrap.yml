name: WeaR Lang Bootstrap Check

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage0-repair:
    name: Apply Stage-0 M1 source repairs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply deterministic repair codemod
        run: python3 tools/repair_stage0.py

      - name: Commit source repairs
        run: |
          if git diff --quiet; then
            echo "No Stage-0 repairs required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler.c compiler.wr runtime.c
          git commit -m "fix(bootstrap): synchronize Stage-0 and Stage-1 sources"
          git push origin HEAD:${{ github.ref_name }}

  bootstrap-experiment:
    name: Stage-0 -> Stage-1 -> Stage-2 reproducibility
    needs: stage0-repair
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run multi-stage bootstrap
        run: bash tools/bootstrap_smoke.sh
